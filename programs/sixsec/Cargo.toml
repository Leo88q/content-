[package]
name = "sixsec"
version = "0.1.0"
description = "SixSec — маркетплейс микрозаданий для генерации промо-контента"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sixsec"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Пины зафиксированы в ADR-0005. Anchor 1.2.0 сам тянет solana-* линии ^3 —
# не поднимать до ^4, это сломает сборку.
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"

# Набор взят из собственного шаблона Anchor 1.2.0 (cli/src/template.rs, ветка V1 +
# TestTemplate::Litesvm), а не подобран на глаз: litesvm 0.10 — единственная линия,
# совместимая с solana-* ^3, которые пинит anchor-lang 1.2.0. Более свежие litesvm
# (0.14-0.16) тянут agave-* 4.x, и типы Pubkey/Transaction перестают совпадать.
[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
