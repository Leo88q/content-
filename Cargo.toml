[workspace]
members = ["programs/sixsec"]
resolver = "2"

# Программа распоряжается ценностями, поэтому арифметическое переполнение
# обязано паниковать, а не молча заворачиваться. См. ADR-0009.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
